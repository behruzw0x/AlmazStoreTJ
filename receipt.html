<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  html,body{width:1000px;height:1340px;overflow:hidden;position:relative}
  .bg{position:absolute;top:0;left:-1px;width:1002px;height:1340px;object-fit:fill}
  .val{position:absolute;right:155px;text-align:right;font-weight:800;font-size:27px;color:#0f172a;max-width:440px;line-height:1.18;word-break:break-word}
  #id{top:635px}
  #pkg{top:746px}
  #price{top:857px;color:#059669;font-size:29px}
  #uid{top:968px;color:#0284c7;font-size:29px}
</style>
</head>
<body>
  <img class="bg" src="receipt-bg.jpg"/>
  <div class="val" id="id"></div>
  <div class="val" id="pkg"></div>
  <div class="val" id="price"></div>
  <div class="val" id="uid"></div>
  <script>
    const p = new URLSearchParams(location.search);
    document.getElementById('id').textContent = p.get('id') || '';
    const pkg = p.get('pkg') || '';
    const pkgEl = document.getElementById('pkg');
    pkgEl.textContent = pkg;
    if (pkg.length > 22) { pkgEl.style.fontSize = '21px'; pkgEl.style.top = '738px'; }
    const rawPrice = Number(p.get('price'));
    document.getElementById('price').textContent = (Number.isFinite(rawPrice) ? rawPrice.toFixed(2) : (p.get('price') || '')) + ' сомонӣ';
    document.getElementById('uid').textContent = p.get('uid') || '';
  </script>
</body>
</html>
